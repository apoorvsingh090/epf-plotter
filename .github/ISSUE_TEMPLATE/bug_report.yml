name: Bug Report
description: Report a bug in EPF Plotter
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: Steps, expected behaviour, actual behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Area
      options:
        - label: 'form / upload handling'
        - label: 'price download (yfinance)'
        - label: 'optimizer / weights'
        - label: 'frontier or pie plots'
        - label: 'deploy config'
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, URLs, input data, screenshots.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. commit SHA or "latest main"

