{% block content %}
<a href="/">Home</a>
<center>
	<h1>EPF</h1>
	{% for i in data %}
	{{i}} : {{(100*data[i])|round(2)}}%
	<br>
	{% endfor %}
	<br>
	Annualised Return : {{ cla_perf[0]|round(5) }}
	<br>
	Risk(Volatility) : {{ cla_perf[1]|round(5) }}
	<br>
	Sharpe Ratio: {{ cla_perf[2]|round(5) }}
	<br>
	<img src="{{ url_for('static', filename=pie_name) }}" width="600" height="600"
	     alt="Portfolio allocation pie chart">
	<br>
	<img src="{{ url_for('static', filename=frontier_name) }}" width="600" height="400"
	     alt="Efficient frontier">
</center>
{% endblock %}
